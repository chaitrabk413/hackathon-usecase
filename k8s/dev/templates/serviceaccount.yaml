apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default .Values.name .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
{{- if .Values.serviceAccount.annotations }}
  annotations:
{{- range $k, $v := .Values.serviceAccount.annotations }}
    {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
