name: patient-service
namespace: patient-dev
replicaCount: 2

image:
  repository: 288548446501.dkr.ecr.us-east-1.amazonaws.com/hackathon-patient-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

containerPort: 3000

imagePullSecrets:
  - ecr-pull-secret

serviceAccount:
  create: true
  name: patient-service-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::288548446501:role/patient-service-irsa-role

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

config:
  enabled: true
  data:
    NODE_ENV: development

secret:
  enabled: false
  data: {}

probes:
  liveness:
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5
