name: order-service
namespace: order-dev
replicaCount: 2

image:
  repository: 288548446501.dkr.ecr.us-east-1.amazonaws.com/hackathon-order-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

containerPort: 8080

imagePullSecrets:
  - ecr-pull-secret

serviceAccount:
  create: true
  name: order-service-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::288548446501:role/order-service-irsa-role

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

config:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: dev

secret:
  enabled: false
  data: {}

probes:
  liveness:
    path: /orders
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /orders
    initialDelaySeconds: 20
    periodSeconds: 10
